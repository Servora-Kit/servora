name: Publish @servora/proto-utils

on:
  push:
    tags:
      - "proto-utils/v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: web/packages/proto-utils
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build, typecheck, and test
        run: pnpm run test

      - name: Publish to npm
        run: npm publish --provenance --access public --registry=https://registry.npmjs.org
