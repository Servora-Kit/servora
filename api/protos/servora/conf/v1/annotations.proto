syntax = "proto3";

package servora.conf.v1;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/Servora-Kit/servora/api/gen/go/servora/conf/v1;conf";

// =============================================================================
// 配置 schema 注解扩展
// 用法：在配置 message / field 上标注「section 定位」与「默认值 / 必填」语义，
// 供 protoc-gen-servora-conf 生成唯一的 Apply() error 配置处理入口。
// =============================================================================

// FieldRule 声明一个配置字段的默认值与必填语义。
// default 与 required 互斥：required 要求明确提供，允许显式零值；
// default 仅在字段缺失时补值，非空或范围约束由 buf.validate 单独表达。
message FieldRule {
  // 字段默认值的字面量表达。
  // - string 字段：直接字面量（如 "tcp"）；
  // - 数字 / bool 字段：可解析为对应类型的字符串（如 "8080" / "true"）；
  // - google.protobuf.Duration：Go duration 字符串（如 "24h" / "5s"）；
  // 声明本身保留存在性，因此 default: "" 也是有效的字符串默认值。
  optional string default = 1;

  // 是否必须明确提供。标量必须能区分未设置与显式零值，集合不支持此规则。
  bool required = 2;
}

// section 标记按段加载；key 从 message 短名转换为 snake_case，缺段跳过。
// 使用示例:
//   message Broker {
//     option (servora.conf.v1.section) = true;
//     // ...
//   }
extend google.protobuf.MessageOptions {
  bool section = 50400;
}

// field 是字段级别的扩展选项。
// 使用示例:
//   optional string addr = 1 [(servora.conf.v1.field) = { required: true }];
//   optional string network = 2 [(servora.conf.v1.field) = { default: "tcp" }];
extend google.protobuf.FieldOptions {
  FieldRule field = 50401;
}
