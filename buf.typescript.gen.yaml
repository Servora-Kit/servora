version: v2

clean: true

inputs:
  - directory: api/protos
    paths:
      - api/protos/servora

plugins:
  - local: ["go", "tool", "protoc-gen-typescript-http"]
    out: web/packages/proto-utils/src/gen
  - local: ["go", "tool", "protoc-gen-go-errors"]
    out: web/packages/proto-utils/src/gen
    opt:
      - target=ts
      - paths=source_relative
  - local: ["go", "tool", "protoc-gen-servora-crud"]
    out: web/packages/proto-utils/src/gen
    opt:
      - target=ts
      - paths=source_relative
